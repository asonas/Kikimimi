# <repo>/project.yml  (XcodeGen; Kikimimi.xcodeproj is generated and gitignored, like yohaku)
# Validated with xcodegen 2.46.0 during design (project generated, WhisperKit 1.1.1 resolved through the local package).
# Conventions copied from yohaku / YoruMimizuku: team QYP65434UW, Automatic signing, local package by path,
# `info:` + `entitlements:` generated from here.
name: Kikimimi
options:
  developmentLanguage: ja
  bundleIdPrefix: as.ason
  deploymentTarget:
    macOS: "14.0"
packages:
  RecorderKit:
    path: core                       # WhisperKit is resolved through core/Package.swift; this file never mentions it
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_LANGUAGE: ja
    DEVELOPMENT_TEAM: QYP65434UW
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Deliberately NOT copying yohaku's SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor. UI types say @MainActor explicitly,
    # so nothing in this target is main-actor by accident.
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Kikimimi:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Icon]
      - path: App/Icon/KikimimiA3/Kikimimi.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: RecorderKit
        product: RecorderCore
      - package: RecorderKit
        product: RecorderAudio
      - package: RecorderKit
        product: RecorderWhisper
      - package: RecorderKit
        product: RecorderSummary
    settings:
      base:
        # One bundle ID for Debug and Release. ASO-109 renamed the identity; TCC needs a one-time re-grant.
        PRODUCT_BUNDLE_IDENTIFIER: as.ason.Kikimimi
        PRODUCT_NAME: Kikimimi
        ASSETCATALOG_COMPILER_APPICON_NAME: Kikimimi
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kikimimi
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        # No LSMultipleInstancesProhibited: Relaunch and the DEBUG headless mode both start a second instance with `open -n`
        # on purpose. The AppDelegate's single-instance nicety skips those launch modes; recovery safety comes from the
        # per-session flock lease, not from instance counting.
        NSMicrophoneUsageDescription: 面接の音声を、相手側の音声とは別トラックで録音するためにマイクを使用します。
        NSCalendarsFullAccessUsageDescription: 面接の予定を表示し、録音の開始や保存名に使うためにカレンダーを読み取ります。
    entitlements:
      path: App/Kikimimi.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
schemes:
  Kikimimi:
    build:
      targets:
        Kikimimi: all
    run:
      config: Debug
    archive:
      config: Release
# No app-level test target in Phase 1: the app target is SwiftUI + the composition root. All tests are `swift test` in core/
# (`mise run test`). App/HeadlessRunner.swift is gated by `#if DEBUG`; XcodeGen's `debug` config preset is recalled (not
# verified) to set SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG. The headless commit checks it (`xcodebuild -showBuildSettings`).
